apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techstore-ingress
  namespace: techstore
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'

    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:711396989537:certificate/4d91e55c-3384-4f56-b7c7-799733aa8f26

    alb.ingress.kubernetes.io/ssl-redirect: '443'

spec:
  ingressClassName: alb

  rules:
    - host: techstore.bzfly.com
      http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 8081

          - path: /api/inventory
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 8082

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80