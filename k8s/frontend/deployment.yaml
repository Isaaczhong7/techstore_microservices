apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: techstore

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      enableServiceLinks: false

      containers:
        - name: frontend
          image: 711396989537.dkr.ecr.us-east-1.amazonaws.com/techstore/frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80