apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: techstore

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      enableServiceLinks: false

      containers:
        - name: frontend
          image: techstore-microservices-frontend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80