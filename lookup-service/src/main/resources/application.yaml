server:
  port: 8084

services:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://product-service:8081}

  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://inventory-service:8082}

spring:

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

    properties:
      schema.registry.url: http://localhost:8070

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

    consumer:
      properties:
        specific.avro.reader: true
      group-id: lookup-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer

  application:
    name: lookup-service


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lookup_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
