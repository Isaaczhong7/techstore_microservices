services:

  # =========================================================
  # Kafka
  # =========================================================
  kafka:
    image: confluentinc/cp-kafka:8.3.1
    hostname: kafka
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:29092,
        EXTERNAL://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:29093

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk


  # =========================================================
  # Schema Registry
  # =========================================================
  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.1
    hostname: schema-registry
    container_name: schema-registry

    depends_on:
      - kafka

    ports:
      - "8070:8081"

    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry

      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: >
        PLAINTEXT://kafka:29092


  # =========================================================
  # PostgreSQL - Order
  # =========================================================
  order-db:
    image: postgres:17
    container_name: order-db

    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5433:5432"

    volumes:
      - order-db-data:/var/lib/postgresql/data


  # =========================================================
  # PostgreSQL - Inventory
  # =========================================================
  inventory-db:
    image: postgres:17
    container_name: inventory-db

    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5434:5432"

    volumes:
      - inventory-db-data:/var/lib/postgresql/data


  # =========================================================
  # PostgreSQL - Payment
  # =========================================================
  payment-db:
    image: postgres:17
    container_name: payment-db

    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5435:5432"

    volumes:
      - payment-db-data:/var/lib/postgresql/data


  # =========================================================
  # PostgreSQL - Product
  # =========================================================
  product-db:
    image: postgres:17
    container_name: product-db

    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5436:5432"

    volumes:
      - product-db-data:/var/lib/postgresql/data

  # =========================================================
  # PostgreSQL - Lookup
  # =========================================================
  lookup-db:
    image: postgres:17
    container_name: lookup-db

    environment:
      POSTGRES_DB: lookup_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5437:5432"

    volumes:
      - lookup-db-data:/var/lib/postgresql/data


  # =========================================================
  # Order Service - port 8080
  # =========================================================
  order-service:
    build:
      context: ./order-service

    container_name: order-service

    depends_on:
      - order-db
      - kafka
      - schema-registry

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: >
        http://schema-registry:8081

      JAVA_TOOL_OPTIONS: "-Dorg.apache.avro.SERIALIZABLE_PACKAGES=com.techstore.kafka"


  # =========================================================
  # Product Service - port 8081
  # =========================================================
  product-service:
    build:
      context: ./product-service

    container_name: product-service

    depends_on:
      - product-db
      - kafka
      - schema-registry

    ports:
      - "8081:8081"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/product_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: >
        http://schema-registry:8081
      JAVA_TOOL_OPTIONS: "-Dorg.apache.avro.SERIALIZABLE_PACKAGES=com.techstore.kafka"


  # =========================================================
  # Inventory Service - port 8082
  # =========================================================
  inventory-service:
    build:
      context: ./inventory-service

    container_name: inventory-service

    depends_on:
      - inventory-db
      - kafka
      - schema-registry

    ports:
      - "8082:8082"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: >
        http://schema-registry:8081
      JAVA_TOOL_OPTIONS: "-Dorg.apache.avro.SERIALIZABLE_PACKAGES=com.techstore.kafka"


  # =========================================================
  # Payment Service - port 8083
  # =========================================================
  payment-service:
    build:
      context: ./payment-service

    container_name: payment-service

    depends_on:
      - payment-db
      - kafka
      - schema-registry

    ports:
      - "8083:8083"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: >
        http://schema-registry:8081

      JAVA_TOOL_OPTIONS: "-Dorg.apache.avro.SERIALIZABLE_PACKAGES=com.techstore.kafka"

      # =========================================================
      # Lookup Service - port 8084
      # =========================================================

  lookup-service:
    build:
      context: ./lookup-service

    container_name: lookup-service

    depends_on:
      product-service:
        condition: service_healthy

      inventory-service:
        condition: service_healthy

      lookup-db:
        condition: service_started

      kafka:
        condition: service_started

      schema-registry:
        condition: service_started

    ports:
      - "8084:8084"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://lookup-db:5432/lookup_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      PRODUCT_SERVICE_URL: http://product-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082

      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: >
        http://schema-registry:8081
      JAVA_TOOL_OPTIONS: "-Dorg.apache.avro.SERIALIZABLE_PACKAGES=com.techstore.kafka"

  # =========================================================
  # Frontend - port 3000
  # =========================================================
  frontend:
    build:
      context: ./frontend

    container_name: techstore-frontend

    depends_on:
      product-service:
        condition: service_healthy

      inventory-service:
        condition: service_healthy

      order-service:
        condition: service_started

      lookup-service:
        condition: service_started

    ports:
      - "3000:80"

# =========================================================
# Persistent database storage
# =========================================================
volumes:
  order-db-data:
  inventory-db-data:
  payment-db-data:
  product-db-data:
  lookup-db-data:
