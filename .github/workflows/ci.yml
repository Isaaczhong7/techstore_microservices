
name: TechStore CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build shared Avro schemas
        working-directory: schemas
        run: mvn -B clean install

      - name: Build and test services
        shell: bash
        run: |
          set -euo pipefail

          for service in \
            order-service \
            product-service \
            inventory-service \
            lookup-service
          do
            echo "Building $service"
            (cd "$service" && mvn -B clean verify)
          done

  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build
